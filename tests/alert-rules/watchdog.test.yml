rule_files:
- ../../catalog/watchdog/heartbeat.yml
evaluation_interval: 30s
tests:
- name: Heartbeat continuous
  interval: 30s
  input_series: []
  promql_expr_test:
  - expr: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)
    eval_time: 0m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
