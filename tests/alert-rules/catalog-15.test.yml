rule_files:
- ../../catalog/kubernetes/workloads_common_v4.0.0.yml
evaluation_interval: 30s
tests:
- name: Kubernetes CrashLoop
  interval: 30s
  input_series:
  - series: kube_pod_container_status_waiting_reason{cluster="example",namespace="app",pod="app-a",container="app",uid="uid1",reason="CrashLoopBackOff"}
    values: 1+0x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="KubePodCrashLoop",alertstate="firing"}) or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
