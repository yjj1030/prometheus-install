rule_files:
- ../../catalog/database/mysql_common_v4.0.0.yml
evaluation_interval: 30s
tests:
- name: MySQL high connection ratio
  interval: 30s
  input_series:
  - series: mysql_global_status_threads_connected{job="mysql",instance="db-a"}
    values: 90+0x60
  - series: mysql_global_variables_max_connections{job="mysql",instance="db-a"}
    values: 100+0x60
  promql_expr_test:
  - expr: count(ALERTS{alertname="MySQLConnectionsHigh",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 1
