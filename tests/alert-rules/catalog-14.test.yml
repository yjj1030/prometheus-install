rule_files:
- ../../catalog/containers/cadvisor.yml
evaluation_interval: 30s
tests:
- name: Unlimited container memory is excluded
  interval: 30s
  input_series:
  - series: container_memory_working_set_bytes{instance="container-a",name="app",image="example"}
    values: 100+0x60
  - series: container_spec_memory_limit_bytes{instance="container-a",name="app",image="example"}
    values: 0+0x60
  promql_expr_test:
  - expr: count(ALERTS{alertname="ContainerMemoryNearLimit",alertstate="firing"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
