rule_files:
- ../../catalog/database/elasticsearch_common_v4.0.0.yml
evaluation_interval: 30s
tests:
- name: ES cluster health red
  interval: 30s
  input_series:
  - series: elasticsearch_cluster_health_status{job="elasticsearch",instance="es-a",cluster="example",color="red"}
    values: 1+0x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="ElasticsearchClusterRed",alertstate="firing"}) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
