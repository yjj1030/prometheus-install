rule_files:
- ../../scenarios/sk-91/test-memory-oom-only/node_alerts.yml
evaluation_interval: 30s
tests:
- name: High memory below100 evaluated according to chosen policy
  interval: 30s
  input_series:
  - series: node:memory_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 99.5+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighWarning",alertstate="firing"}) or vector(0)
    eval_time: 30m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Actual100 still silent in OOM-only
  interval: 30s
  input_series:
  - series: node:memory_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 100+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="NodeMemoryUsageHighWarning",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 0
- name: OOM event fires without extra for and expires with event window
  interval: 30s
  input_series:
  - series: node_vmstat_oom_kill{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 0+0x3 1+0x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeOOMKillDetected",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeOOMKillDetected",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Counter reset alone is not OOM event
  interval: 30s
  input_series:
  - series: node_vmstat_oom_kill{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 5+0x3 0+0x40
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeOOMKillDetected",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Missing OOM input is unknown, not a synthetic OOM
  interval: 30s
  input_series:
  - series: up{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 1+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeOOMKillDetected",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Memory silence does not suppress CPU
  interval: 30s
  input_series:
  - series: node:cpu_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 100+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeCPUUsageHighCritical",alertstate="firing"}) or vector(0)
    eval_time: 30m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeCPUUsageHighWarning",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Memory silence does not suppress filesystem
  interval: 30s
  input_series:
  - series: node:filesystem_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default",device="/dev/vda1",fstype="ext4",mountpoint="/"}
    values: 99+0x260
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeFilesystemUsageCritical",alertstate="firing"}) or vector(0)
    eval_time: 30m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeFilesystemUsageWarning",alertstate="firing"}) or vector(0)
    eval_time: 120m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Default-tag target is included in independent test profile
  interval: 30s
  input_series:
  - series: up{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 0+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeDownWarning",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="NodeDownCritical",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 1
- name: Swap allocated but inactive is not pressure
  interval: 30s
  input_series:
  - series: node:swap_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 95+0x140
  - series: node:swap_activity:rate5m{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 0+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeSwapPressureWarning",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Active swap policy differs only by memory mode
  interval: 30s
  input_series:
  - series: node:swap_usage:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 95+0x140
  - series: node:swap_activity:rate5m{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 2+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeSwapPressureWarning",alertstate="firing"}) or vector(0)
    eval_time: 30m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Test policy does not import production TCP thresholds
  interval: 30s
  input_series:
  - series: node:tcp_retransmission:percent{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 50+0x140
  - series: node:tcp_out_segments:rate5m{job="node_exporter",instance="host-a:9100",alert_policy="default"}
    values: 1000+0x140
  promql_expr_test:
  - expr: count(ALERTS{alertname="NodeTCPRetransmissionCritical",alertstate="firing"}) or vector(0)
    eval_time: 60m
    exp_samples:
    - labels: '{}'
      value: 0
