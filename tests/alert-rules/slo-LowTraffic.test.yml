rule_files:
- ../../catalog/slo/http_common_v4.0.0.yml
evaluation_interval: 30s
tests:
- name: LowTraffic
  interval: 30s
  input_series:
  - series: ops_http_requests_total{site="example",environment_class="prod",service="oa",result="bad"}
    values: 0+1x180
  - series: ops_http_requests_total{site="example",environment_class="prod",service="oa",result="good"}
    values: 0+0x180
  promql_expr_test:
  - expr: count(ALERTS{alertname="ServiceErrorBudgetBurnFast",alertstate="firing"}) or vector(0)
    eval_time: 65m
    exp_samples:
    - labels: '{}'
      value: 0
