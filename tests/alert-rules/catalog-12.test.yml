rule_files:
- ../../catalog/messaging/rabbitmq_common_v4.0.0.yml
evaluation_interval: 30s
tests:
- name: Queue backlog without consumer
  interval: 30s
  input_series:
  - series: rabbitmq_queue_messages_ready{job="rabbitmq",instance="rabbit-a",vhost="example",queue="q1"}
    values: 10+0x60
  - series: rabbitmq_queue_consumers{job="rabbitmq",instance="rabbit-a",vhost="example",queue="q1"}
    values: 0+0x60
  promql_expr_test:
  - expr: count(ALERTS{alertname="RabbitMQQueueWithoutConsumers",alertstate="firing"}) or vector(0)
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 1
