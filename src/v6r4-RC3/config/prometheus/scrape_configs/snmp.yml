# ==============================================================================
# scrape_configs/snmp.yml
#
# SNMP 设备抓取配置 (snmp_exporter 0.28.0)
# 通过 file_sd 动态添加目标 (file_sd 路径由 prometheus_installer install 时
#   sed 替换 `__PROM_FILE_SD_BASE__` → ${INSTALL_ROOT}/${SERVICE_NAME_PREFIX}-${PORT}/etc/targets)
#
# 02 §2.1 标签禁区：
#   - community 不得作为标签；改用 __param_auth (snmp_exporter 鉴权参数)
# 02 §2.3 BREAKING：
#   - 0.28.0 sysUpTime 已从 if_mib 移至 system 模块
#   - file_sd.module 必须为组合模块名（在 snmp.yml generator 中预定义），形如:
#       if_mib  sys_mib  if_mib_system  walk_system_only
#   - 默认场景使用 if_mib_system（同时拿 ifXTable + sysUpTime/sysName/sysDescr）
#
# 审核 P1-06: 目标 / 认证 / 模块覆盖顺序（显式且可追溯）
#   优先级（低 → 高；后者覆盖前者）：
#     1. snmp.yml 内模块默认 auth.community（snmp_exporter 静态配置）
#     2. SNMP_AUTH_FILE 环境变量（v3.0.0-rc4-G0：auth_password_file 形式）
#     3. file_sd target.labels.auth       → 写入 __param_auth
#     4. file_sd target.labels.community  → 写入 __param_auth（与 auth 字段相同优先级，后者覆盖）
#     5. file_sd target.labels.module     → 写入 __param_module（无则使用 if_mib_system 默认）
#   注意：v3.0.0-rc4 起 community 已**不作为最终 sample 标签**，仅作为 __param_auth 的传递变量
#
# v3.0.0-rc4: file_sd 路径用 `__PROM_FILE_SD_BASE__` 占位符替代硬编码
#             /usr/local/prometheus/prometheus-9090/etc/targets，适配
#             --port / INSTALL_ROOT 自定义场景
# ==============================================================================

scrape_configs:
  - job_name: snmp_exporter
    metrics_path: /snmp
    file_sd_configs:
      - files:
          - '__PROM_FILE_SD_BASE__/snmp/*.json'
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: __param_target
        replacement: '${1}'

      # 02 §2.1 + 审核 P1-06: community 与 auth 字段都映射到 __param_auth
      # 后定义的源覆盖先定义的源：auth 优先于 community
      - source_labels: [community]
        target_label: __param_auth
        action: replace
      - source_labels: [auth]
        target_label: __param_auth
        action: replace

      # 模块：默认 if_mib_system；目标 file_sd 可显式覆盖
      - source_labels: [module]
        target_label: __param_module
        action: replace
        regex: '(.+)'
        replacement: '${1}'
      # 未提供 module 时使用默认
      - target_label: __param_module
        replacement: if_mib_system

      # SNMPv3 认证参数（v3 only；v2c 忽略）
      - source_labels: [security_level]
        target_label: __param_security_level
        action: replace
      - source_labels: [auth_protocol]
        target_label: __param_auth_protocol
        action: replace
      - source_labels: [priv_protocol]
        target_label: __param_priv_protocol
        action: replace
      - source_labels: [username]
        target_label: __param_auth_username
        action: replace

      # 设备标签保留 (file_sd 上提供)
      - source_labels: [__param_target]
        target_label: device
      - source_labels: [device_role]
        target_label: device_role
      - source_labels: [site]
        target_label: site
      - source_labels: [env]
        target_label: env

      - target_label: __address__
        replacement: 127.0.0.1:9116
      - target_label: job
        replacement: snmp_exporter
      - target_label: asset_type
        replacement: network_device
      - target_label: role
        replacement: infrastructure

    metric_relabel_configs:
      # 白名单：仅保留 ifXTable + sysUpTime/sysName/sysDescr/sensor
      - source_labels: [__name__]
        regex: 'if(HCInOctets|HCOutOctets|OperStatus|AdminStatus|Speed|InErrors|OutErrors|InDiscards|OutDiscards|InUcastPkts|OutUcastPkts).*|snmp_(sysUpTime|sysName|sysDescr|sysObjectID|sysContact|sysLocation|cpu|mem|sensor).*'
        action: keep
      # 02 §2.1: 显式丢弃可能误传的 community 字段（即便用户塞进 labels）
      # v3.0.0-rc4 audit-blocking 修复（B02）：labeldrop 按"标签名"匹配，
      # source_labels 用于值匹配、不参与 labeldrop；原写法把 source_labels + labeldrop
      # 混用导致约束不符合预期。现改用 regex 匹配标签名。
      - action: labeldrop
        regex: '(community|auth)'

  # ==============================================================================
  # 目标清单示例 (targets/snmp/sw-core-01.json)
  # 注意: community 字段作为 __param_auth 来源，不进入最终 sample 标签
