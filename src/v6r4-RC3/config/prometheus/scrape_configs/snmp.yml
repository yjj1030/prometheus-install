  # {
  #   "targets": ["192.0.2.1"],
  #   "labels": {
  #     "community": "prom_snmp_v2c",
  #     "module": "if_mib_system",
  #     "site": "primary",
  #     "device": "sw-core-01",
  #     "device_role": "core",
  #     "rack": "B-12"
  #   }
  # }
  #
  # ==============================================================================
