groups:
- name: application_contracts
  interval: 30s
  rules:
  - alert: BackupRPOExceeded
    expr: (time() - ops_backup_last_success_timestamp_seconds) > on(site,environment_class,service,backup_job) ops_backup_rpo_seconds
    labels:
      severity: critical
      category: backup
      condition_id: backup_rpo
      alert_type: state
    annotations:
      summary: 备份成功时间超过RPO
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查最近备份、恢复点及副本；备份成功不证明可恢复。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (time() - ops_backup_last_success_timestamp_seconds) > on(site,environment_class,service,backup_job)
        ops_backup_rpo_seconds；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: RestoreTestOverdue
    expr: (time() - ops_restore_test_last_success_timestamp_seconds) > on(site,environment_class,service,backup_job)
      ops_restore_test_max_age_seconds
    labels:
      severity: warning
      category: backup
      condition_id: backup_restore_test
      alert_type: state
    annotations:
      summary: 恢复演练超过有效期
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 安排恢复验证并核实校验与业务可用结果。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (time() - ops_restore_test_last_success_timestamp_seconds) > on(site,environment_class,service,backup_job)
        ops_restore_test_max_age_seconds；持续 1h
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 1h
  - alert: BatchJobLate
    expr: (time() - ops_batch_last_success_timestamp_seconds) > on(site,environment_class,service,batch_job) ops_batch_max_delay_seconds
    labels:
      severity: warning
      category: application
      condition_id: batch_late
      alert_type: state
    annotations:
      summary: 批任务未在时限内成功
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按业务日历、截止时间和上游依赖核查，不用统一24小时。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (time() - ops_batch_last_success_timestamp_seconds) > on(site,environment_class,service,batch_job)
        ops_batch_max_delay_seconds；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: BusinessQueueTooOld
    expr: ops_business_queue_oldest_age_seconds > on(site,environment_class,service,queue) ops_business_queue_max_age_seconds
    labels:
      severity: warning
      category: application
      condition_id: business_queue_age
      alert_type: state
    annotations:
      summary: 业务待办超过处理时限
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查最老任务、消费者及失败重试。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ops_business_queue_oldest_age_seconds > on(site,environment_class,service,queue) ops_business_queue_max_age_seconds；持续
        10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
  - alert: ConsumerLagTooOld
    expr: ops_consumer_lag_seconds > on(site,environment_class,service,consumer_group,topic) ops_consumer_lag_budget_seconds
    labels:
      severity: warning
      category: application
      condition_id: consumer_lag
      alert_type: state
    annotations:
      summary: 消息消费延迟超过预算
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 区分无新消息与真实积压；按业务时限判断。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ops_consumer_lag_seconds > on(site,environment_class,service,consumer_group,topic) ops_consumer_lag_budget_seconds；持续
        10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
  - alert: ManagedProcessMissing
    expr: ops_process_running{managed="true"} == 0
    labels:
      severity: critical
      category: application
      condition_id: managed_process
      alert_type: state
    annotations:
      summary: 受管进程未运行
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查进程、服务管理器与实际端点；指标缺失另行告警。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ops_process_running{managed="true"} == 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: InternalCertificateExpiring
    expr: ops_certificate_not_after_seconds - time() < 30 * 86400
    labels:
      severity: warning
      category: application
      condition_id: internal_certificate
      alert_type: state
    annotations:
      summary: 受管证书将在30天内到期
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查用途、续签与部署；本地证书文件不代表线上已替换。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ops_certificate_not_after_seconds - time() < 30 * 86400；持续 30m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 30m
  - alert: GatewayDeliveryFailed
    expr: increase(ops_gateway_delivery_failures_total[10m]) > 0
    labels:
      severity: critical
      category: application
      condition_id: gateway_delivery
      alert_type: state
    annotations:
      summary: 通知网关下游投递失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核对队列、重试、死信及最终接收回执；指标需网关适配。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(ops_gateway_delivery_failures_total[10m]) > 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: ContractMetricMissing
    expr: ops_expected_metric_info unless on(site,environment_class,service,metric_id) ops_observed_metric_info
    labels:
      severity: warning
      category: application
      condition_id: contract_missing
      alert_type: state
    annotations:
      summary: 期望的业务监控指标缺失
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查独立期望清单和采集适配；禁止用同一缺失源生成期望值。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ops_expected_metric_info unless on(site,environment_class,service,metric_id) ops_observed_metric_info；持续
        15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
