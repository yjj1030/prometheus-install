groups:
- name: application_jvm
  interval: 30s
  rules:
  - alert: JVMHeapHigh
    expr: (sum without(id) (jvm_memory_used_bytes{area="heap"}) / sum without(id) (jvm_memory_max_bytes{area="heap"})
      > 0.9) and (sum without(id) (jvm_memory_max_bytes{area="heap"}) > 0)
    labels:
      severity: warning
      category: application
      condition_id: jvm_heap
      alert_type: state
    annotations:
      summary: JVM堆持续接近上限
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查GC后存活量、分配率和业务延迟，堆高不等于进程OOM。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (sum without(id) (jvm_memory_used_bytes{area="heap"}) / sum without(id) (jvm_memory_max_bytes{area="heap"})
        > 0.9) and (sum without(id) (jvm_memory_max_bytes{area="heap"}) > 0)；持续 20m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 20m
  - alert: JVMGCPauseHigh
    expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
    labels:
      severity: warning
      category: application
      condition_id: jvm_gc
      alert_type: state
    annotations:
      summary: JVM GC暂停累计时间持续偏高
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查GC种类、暂停分位数和堆增长；累计时间比例不是单次暂停。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rate(jvm_gc_pause_seconds_sum[5m]) > 0.1；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: JVMThreadsHigh
    expr: jvm_threads_live_threads > 1000
    labels:
      severity: warning
      category: application
      condition_id: jvm_threads
      alert_type: state
    annotations:
      summary: JVM线程数持续偏高
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按线程池基线调整1000起点，查看阻塞与线程转储。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#application
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: jvm_threads_live_threads > 1000；持续 30m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 30m
