groups:
- name: node_availability_alerts
  interval: 30s
  rules:
  - alert: NodeDown
    expr: up{job="node_exporter"} == 0
    for: 2m
    labels:
      severity: critical
      asset_type: server
      category: availability
      alert_type: state
      condition_id: node_down
      notify_profile: availability
    annotations:
      summary: Node Exporter采集失败
      resolved_summary: Node Exporter采集失败重要告警已解除
      object: 采集目标={{ $labels.instance }} / 主机={{ if $labels.asset_ip }}{{ $labels.asset_ip }}{{ else }}{{ $labels.instance
        }}{{ end }}
      current_value: 抓取失败（up=0）
      threshold: Prometheus抓取up=0，连续 ≥2分钟
      impact: 主机指标可能缺失。
      action: 先看Targets抓取错误，再区分链路、鉴权、超时和Exporter状态。
      hostname: '{{- if $labels.hostname -}}

        {{- $labels.hostname -}}

        {{- else if $labels.nodename -}}

        {{- $labels.nodename -}}

        {{- else if and $labels.job $labels.instance -}}

        {{- $fresh := query (printf "max by (nodename) (node_uname_info{job=%q,instance=%q,nodename!=\"\"} == 1
        and (time() - timestamp(node_uname_info{job=%q,instance=%q,nodename!=\"\"}) <= 180))" $labels.job $labels.instance
        $labels.job $labels.instance) -}}

        {{- if eq (len $fresh) 1 -}}

        {{- (index $fresh 0).Labels.nodename -}}

        {{- else if eq (len $fresh) 0 -}}

        {{- $history := query (printf "sort_desc(max by (nodename) (node:hostname:last_seen_timestamp_seconds{job=%q,instance=%q,nodename!=\"\"}
        >= time() - 86400))" $labels.job $labels.instance) -}}

        {{- if eq (len $history) 1 -}}

        {{- (index $history 0).Labels.nodename -}}

        {{- else if gt (len $history) 1 -}}

        {{- if gt (index $history 0).Value (index $history 1).Value -}}

        {{- (index $history 0).Labels.nodename -}}

        {{- else -}}未提供{{- end -}}

        {{- else -}}未提供{{- end -}}

        {{- else -}}未提供{{- end -}}

        {{- else -}}未提供{{- end -}}'
  - alert: NodeExporterFlapping
    expr: changes(up{job="node_exporter"}[15m]) >= 4
    for: 5m
    labels:
      severity: warning
      asset_type: server
      category: availability
      alert_type: state
      condition_id: node_exporter_flapping
      notify_profile: monitoring_agent
    annotations:
      summary: Node Exporter采集状态反复变化
      resolved_summary: Node Exporter采集状态反复变化一般告警已解除
      object: '{{ if $labels.asset_ip }}{{ $labels.asset_ip }}{{ else }}{{ $labels.instance }}{{ end }}'
      current_value: 最近15分钟up变化 {{ printf "%.0f" $value }}次
      threshold: 15分钟内状态变化 ≥4次，并持续5分钟
      impact: 指标连续性可能受影响。
      action: 对照每次抓取错误，检查链路抖动、超时及Exporter重启。
      hostname: '{{- if $labels.hostname -}}

        {{- $labels.hostname -}}

        {{- else if $labels.nodename -}}

        {{- $labels.nodename -}}

        {{- else if and $labels.job $labels.instance -}}

