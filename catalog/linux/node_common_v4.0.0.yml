      label_replace(up{job="node_exporter"} == 1, "collector", "cpu", "instance", ".*")

      or

      label_replace(up{job="node_exporter"} == 1, "collector", "diskstats", "instance", ".*")

      or

      label_replace(up{job="node_exporter"} == 1, "collector", "filesystem", "instance", ".*")

      or

      label_replace(up{job="node_exporter"} == 1, "collector", "filefd", "instance", ".*")

      or

      label_replace(up{job="node_exporter"} == 1, "collector", "loadavg", "instance", ".*")

