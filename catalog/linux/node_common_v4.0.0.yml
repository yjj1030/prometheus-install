        {{- else -}}未提供{{- end -}}

        {{- else -}}未提供{{- end -}}

        {{- else -}}未提供{{- end -}}'
  - alert: NodeTargetDisappeared
    expr: '(node:monitor_target:last_seen_timestamp_seconds{alert_policy!~"nonprod|stress"} > 0)

      unless on (instance, job) up{job="node_exporter"}

      '
    for: 10m
    labels:
      severity: warning
      asset_type: server
      category: availability
      alert_type: state
      condition_id: node_target_disappeared
      notify_profile: monitoring_agent
    annotations:
      summary: 监控目标已从采集列表消失
      resolved_summary: 目标消失告警已结束（目标重新出现或24小时历史窗口结束）
      object: '{{ if $labels.asset_ip }}{{ $labels.asset_ip }}{{ else }}{{ $labels.instance }}{{ end }}'
      current_value: 最近出现时间={{ $value | humanizeTimestamp }}
