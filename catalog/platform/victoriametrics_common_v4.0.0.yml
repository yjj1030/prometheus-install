groups:
- name: platform_victoriametrics
  interval: 30s
  rules:
  - alert: VMReadOnly
    expr: vm_storage_is_read_only{job="victoriametrics"} == 1
    labels:
      severity: critical
      category: monitoring
      condition_id: vm_readonly
      alert_type: state
    annotations:
      summary: VictoriaMetrics进入只读
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查磁盘余量、只读阈值和写入失败。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: vm_storage_is_read_only{job="victoriametrics"} == 1；持续 2m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 2m
  - alert: VMLowDiskHeadroom
    expr: vm_free_disk_space_bytes{job="victoriametrics"} < vm_free_disk_space_limit_bytes{job="victoriametrics"}
      * 1.5
    labels:
      severity: warning
      category: monitoring
      condition_id: vm_disk
      alert_type: state
    annotations:
      summary: VictoriaMetrics接近只读磁盘限制
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核实合并所需余量、保留期与扩容窗口。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: vm_free_disk_space_bytes{job="victoriametrics"} < vm_free_disk_space_limit_bytes{job="victoriametrics"}
        * 1.5；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: VMRequestErrors
    expr: increase(vm_http_request_errors_total{job="victoriametrics"}[5m]) > 0
    labels:
      severity: warning
      category: monitoring
      condition_id: vm_api
      alert_type: state
    annotations:
      summary: VictoriaMetrics API持续出现错误
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按path检查请求类型，区分错误请求和服务问题。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(vm_http_request_errors_total{job="victoriametrics"}[5m]) > 0；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: VMRowsRejected
    expr: rate(vm_rows_ignored_total{job="victoriametrics"}[5m]) > 0
    labels:
      severity: warning
      category: monitoring
      condition_id: vm_ingestion
      alert_type: state
    annotations:
      summary: VictoriaMetrics拒绝部分写入样本
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按reason定位时间戳、格式、限制和数据丢弃原因。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rate(vm_rows_ignored_total{job="victoriametrics"}[5m]) > 0；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: VMQueryAdmissionTimeout
    expr: increase(vm_concurrent_select_limit_timeout_total{job="victoriametrics"}[5m]) > 0
    labels:
      severity: warning
      category: monitoring
      condition_id: vm_query
      alert_type: state
    annotations:
      summary: VictoriaMetrics查询排队超时
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 定位查询并发、慢查询和CPU，核实上游重试。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(vm_concurrent_select_limit_timeout_total{job="victoriametrics"}[5m]) > 0；持续 10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
