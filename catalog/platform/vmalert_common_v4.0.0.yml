groups:
- name: platform_vmalert
  interval: 30s
  rules:
  - alert: VMAlertEvaluationError
    expr: increase(vmalert_alerting_rules_errors_total{job="vmalert"}[5m]) > 0
    labels:
      severity: critical
      category: monitoring
      condition_id: vmalert_eval
      alert_type: state
    annotations:
      summary: vmalert规则执行错误
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核对datasource、查询错误及规则语法。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(vmalert_alerting_rules_errors_total{job="vmalert"}[5m]) > 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: VMAlertDeliveryError
    expr: increase(vmalert_alerts_send_errors_total{job="vmalert"}[5m]) > 0
    labels:
      severity: critical
      category: monitoring
      condition_id: vmalert_delivery
      alert_type: state
    annotations:
      summary: vmalert发送告警失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查Alertmanager地址、认证与网络。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(vmalert_alerts_send_errors_total{job="vmalert"}[5m]) > 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: VMAlertSelectorNoSeries
    expr: vmalert_alerting_rules_last_evaluation_series_fetched{job="vmalert"} == 0
    labels:
      severity: warning
      category: monitoring
      condition_id: vmalert_coverage
      alert_type: state
    annotations:
      summary: vmalert规则输入未取到时序
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 先判断规则是否应有输入；新接入和条件性指标可豁免，不等同于故障。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: vmalert_alerting_rules_last_evaluation_series_fetched{job="vmalert"} == 0；持续 1h
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 1h
