groups:
- name: platform_alertmanager
  interval: 30s
  rules:
  - alert: AlertmanagerConfigReloadFailed
    expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
    labels:
      severity: critical
      category: platform
      condition_id: am_reload
      alert_type: state
    annotations:
      summary: Alertmanager配置重载失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查配置、模板和旧配置是否仍在服务。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: alertmanager_config_last_reload_successful{job="alertmanager"} == 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: AlertmanagerNotificationFailed
    expr: rate(alertmanager_notifications_failed_total{job="alertmanager"}[5m]) / ignoring(reason) group_left rate(alertmanager_notifications_total{job="alertmanager"}[5m])
      > 0.01
    labels:
      severity: warning
      category: platform
      condition_id: am_delivery
      alert_type: state
    annotations:
      summary: Alertmanager通知发送失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按integration定位HTTP响应、鉴权、限流及接收端日志。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rate(alertmanager_notifications_failed_total{job="alertmanager"}[5m]) / ignoring(reason) group_left
        rate(alertmanager_notifications_total{job="alertmanager"}[5m]) > 0.01；持续 10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
  - alert: AlertmanagerNotificationAllFailed
    expr: rate(alertmanager_notifications_failed_total{job="alertmanager"}[5m]) / ignoring(reason) group_left rate(alertmanager_notifications_total{job="alertmanager"}[5m])
      >= 1
    labels:
      severity: critical
      category: platform
      condition_id: am_delivery
      alert_type: state
    annotations:
      summary: 某Alertmanager通知持续全部失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查其他副本是否可发、接收端及网络；本规则按实例告警。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rate(alertmanager_notifications_failed_total{job="alertmanager"}[5m]) / ignoring(reason) group_left
        rate(alertmanager_notifications_total{job="alertmanager"}[5m]) >= 1；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: AlertmanagerClusterInconsistent
    expr: count by(job) (count_values by(job) ("members",alertmanager_cluster_members{job="alertmanager"})) > 1
    labels:
      severity: warning
      category: platform
      condition_id: am_cluster
      alert_type: state
    annotations:
      summary: Alertmanager成员视图不一致
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查gossip互联和分区；副本数需用期望清单单独核对。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#platform
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: count by(job) (count_values by(job) ("members",alertmanager_cluster_members{job="alertmanager"}))
        > 1；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
