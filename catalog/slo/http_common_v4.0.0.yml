groups:
- name: slo_http
  interval: 30s
  rules:
  - alert: ServiceErrorBudgetBurnFast
    expr: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[1h])) / sum by(site,environment_class,service)
      (rate(ops_http_requests_total[1h]))) > 14.4 * 0.001) and ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[5m]))
      / sum by(site,environment_class,service) (rate(ops_http_requests_total[5m]))) > 14.4 * 0.001) and (sum by(site,environment_class,service)
      (increase(ops_http_requests_total[5m])) >= 100)
    labels:
      severity: critical
      category: slo
      condition_id: service_error_budget
      alert_type: state
    annotations:
      summary: 服务错误预算消耗过快
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按服务SLI和错误预算定位失败请求；低流量门槛可能漏报，需配合合成探测。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#slo
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[1h])) / sum
        by(site,environment_class,service) (rate(ops_http_requests_total[1h]))) > 14.4 * 0.001) and ((sum by(site,environment_class,service)
        (rate(ops_http_requests_total{result="bad"}[5m])) / sum by(site,environment_class,service) (rate(ops_http_requests_total[5m])))
        > 14.4 * 0.001) and (sum by(site,environment_class,service) (increase(ops_http_requests_total[5m])) >= 100)；持续
        无额外for等待
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
  - alert: ServiceErrorBudgetBurnSlow
    expr: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[6h])) / sum by(site,environment_class,service)
      (rate(ops_http_requests_total[6h]))) > 6 * 0.001) and ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[30m]))
      / sum by(site,environment_class,service) (rate(ops_http_requests_total[30m]))) > 6 * 0.001) and (sum by(site,environment_class,service)
      (increase(ops_http_requests_total[30m])) >= 100)
    labels:
      severity: critical
      category: slo
      condition_id: service_error_budget
      alert_type: state
    annotations:
      summary: 服务错误预算消耗过快
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按服务SLI和错误预算定位失败请求；低流量门槛可能漏报，需配合合成探测。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#slo
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[6h])) / sum
        by(site,environment_class,service) (rate(ops_http_requests_total[6h]))) > 6 * 0.001) and ((sum by(site,environment_class,service)
        (rate(ops_http_requests_total{result="bad"}[30m])) / sum by(site,environment_class,service) (rate(ops_http_requests_total[30m])))
        > 6 * 0.001) and (sum by(site,environment_class,service) (increase(ops_http_requests_total[30m])) >= 100)；持续
        无额外for等待
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
  - alert: ServiceErrorBudgetBurnTicket
    expr: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[3d])) / sum by(site,environment_class,service)
      (rate(ops_http_requests_total[3d]))) > 1 * 0.001) and ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[6h]))
      / sum by(site,environment_class,service) (rate(ops_http_requests_total[6h]))) > 1 * 0.001) and (sum by(site,environment_class,service)
      (increase(ops_http_requests_total[6h])) >= 100)
    labels:
      severity: warning
      category: slo
      condition_id: service_error_budget
      alert_type: state
    annotations:
      summary: 服务错误预算消耗过快
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按服务SLI和错误预算定位失败请求；低流量门槛可能漏报，需配合合成探测。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#slo
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: ((sum by(site,environment_class,service) (rate(ops_http_requests_total{result="bad"}[3d])) / sum
        by(site,environment_class,service) (rate(ops_http_requests_total[3d]))) > 1 * 0.001) and ((sum by(site,environment_class,service)
        (rate(ops_http_requests_total{result="bad"}[6h])) / sum by(site,environment_class,service) (rate(ops_http_requests_total[6h])))
        > 1 * 0.001) and (sum by(site,environment_class,service) (increase(ops_http_requests_total[6h])) >= 100)；持续
        无额外for等待
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
