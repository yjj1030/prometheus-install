groups:
- name: database_postgresql
  interval: 30s
  rules:
  - alert: PostgreSQLUnavailable
    expr: pg_up{job="postgresql"} == 0
    labels:
      severity: critical
      category: database
      condition_id: pg_up
      alert_type: state
    annotations:
      summary: PostgreSQL连接检查失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查连接、认证、恢复模式和服务状态。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#database
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: pg_up{job="postgresql"} == 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: PostgreSQLDeadlocks
    expr: increase(pg_stat_database_deadlocks{job="postgresql"}[10m]) > 0
    labels:
      severity: warning
      category: database
      condition_id: pg_deadlock
      alert_type: state
    annotations:
      summary: PostgreSQL发生死锁
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 定位涉及事务与SQL；事件窗口结束不证明事务影响已消除。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#database
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: increase(pg_stat_database_deadlocks{job="postgresql"}[10m]) > 0；持续 无额外for等待
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
  - alert: PostgreSQLRollbackRatio
    expr: (rate(pg_stat_database_xact_rollback{job="postgresql"}[5m]) / (rate(pg_stat_database_xact_commit{job="postgresql"}[5m])
      + rate(pg_stat_database_xact_rollback{job="postgresql"}[5m])) > 0.05) and ((rate(pg_stat_database_xact_commit{job="postgresql"}[5m])
      + rate(pg_stat_database_xact_rollback{job="postgresql"}[5m])) > 1)
    labels:
      severity: warning
      category: database
      condition_id: pg_rollback
      alert_type: state
    annotations:
      summary: PostgreSQL事务回滚比例持续偏高
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核实应用主动回滚、异常、死锁及业务失败，门槛1事务/秒仅示例。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#database
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (rate(pg_stat_database_xact_rollback{job="postgresql"}[5m]) / (rate(pg_stat_database_xact_commit{job="postgresql"}[5m])
        + rate(pg_stat_database_xact_rollback{job="postgresql"}[5m])) > 0.05) and ((rate(pg_stat_database_xact_commit{job="postgresql"}[5m])
        + rate(pg_stat_database_xact_rollback{job="postgresql"}[5m])) > 1)；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: PostgreSQLReplicaLag
    expr: pg_replication_lag_seconds{job="postgresql"} > 60
    labels:
      severity: warning
      category: database
      condition_id: pg_replication
      alert_type: state
    annotations:
      summary: PostgreSQL复制延迟偏高
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核对WAL接收、回放和复制槽；按当前collector实际名称校验。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#database
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: pg_replication_lag_seconds{job="postgresql"} > 60；持续 10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
