groups:
- name: probes_availability
  interval: 30s
  rules:
  - alert: BlackboxExporterScrapeFailed
    expr: up{job=~"blackbox.*"} == 0
    labels:
      severity: critical
      category: probes
      condition_id: blackbox_scrape
      alert_type: state
    annotations:
      summary: 探测请求抓取失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 查看Targets错误和Exporter状态；不能据此断言业务宕机。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#probes
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: up{job=~"blackbox.*"} == 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: BlackboxEndpointFailed
    expr: probe_success{probe_kind=~"http|tcp|dns|icmp"} == 0
    labels:
      severity: critical
      category: probes
      condition_id: blackbox_probe
      alert_type: state
    annotations:
      summary: 端点探测失败
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 从另一探测点复核；检查DNS、路由、握手及HTTP匹配规则。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#probes
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: probe_success{probe_kind=~"http|tcp|dns|icmp"} == 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
  - alert: BlackboxProbeSlow
    expr: probe_duration_seconds{probe_kind=~"http|tcp|dns"} > 3
    labels:
      severity: warning
      category: probes
      condition_id: blackbox_latency
      alert_type: state
    annotations:
      summary: 端点探测耗时偏高
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核对各phase耗时及业务响应目标，3秒仅为示例。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#probes
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: probe_duration_seconds{probe_kind=~"http|tcp|dns"} > 3；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: BlackboxSuccessMetricMissing
    expr: (up{job=~"blackbox.*"} == 1) unless on(job,instance) probe_success
    labels:
      severity: warning
      category: probes
      condition_id: blackbox_missing
      alert_type: state
    annotations:
      summary: 抓取成功但探测结果指标缺失
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查module、抓取路径和metric_relabel，不填零伪造健康。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#probes
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (up{job=~"blackbox.*"} == 1) unless on(job,instance) probe_success；持续 10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
