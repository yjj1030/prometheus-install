groups:
- name: messaging_kafka
  interval: 30s
  rules:
  - alert: KafkaOfflinePartitions
    expr: kafka_controller_kafkacontroller_offlinepartitionscount{job="kafka"} > 0
    labels:
      severity: critical
      category: messaging
      condition_id: kafka_offline
      alert_type: state
    annotations:
      summary: Kafka存在离线分区
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查Controller、Broker和分区Leader。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: kafka_controller_kafkacontroller_offlinepartitionscount{job="kafka"} > 0；持续 2m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 2m
  - alert: KafkaUnderReplicatedPartitions
    expr: kafka_server_replicamanager_underreplicatedpartitions{job="kafka"} > 0
    labels:
      severity: warning
      category: messaging
      condition_id: kafka_replica
      alert_type: state
    annotations:
      summary: Kafka分区副本不足
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查Broker、ISR、磁盘及复制网络。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: kafka_server_replicamanager_underreplicatedpartitions{job="kafka"} > 0；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: KafkaUnderMinISR
    expr: kafka_server_replicamanager_underminisrpartitioncount{job="kafka"} > 0
    labels:
      severity: critical
      category: messaging
      condition_id: kafka_minisr
      alert_type: state
    annotations:
      summary: Kafka分区低于最小ISR
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核实写入失败、acks策略与副本恢复；勿直接降低安全级别。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: kafka_server_replicamanager_underminisrpartitioncount{job="kafka"} > 0；持续 5m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 5m
