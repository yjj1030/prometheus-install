groups:
- name: messaging_rabbitmq
  interval: 30s
  rules:
  - alert: RabbitMQMemoryWatermark
    expr: rabbitmq_process_resident_memory_bytes{job="rabbitmq"} / rabbitmq_resident_memory_limit_bytes{job="rabbitmq"}
      > 0.9
    labels:
      severity: warning
      category: messaging
      condition_id: rabbit_memory
      alert_type: state
    annotations:
      summary: RabbitMQ接近内存水位
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 核查流控、队列积压、消费者及节点内存。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rabbitmq_process_resident_memory_bytes{job="rabbitmq"} / rabbitmq_resident_memory_limit_bytes{job="rabbitmq"}
        > 0.9；持续 10m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 10m
  - alert: RabbitMQDiskWatermark
    expr: rabbitmq_disk_space_available_bytes{job="rabbitmq"} < rabbitmq_disk_space_available_limit_bytes{job="rabbitmq"}
    labels:
      severity: critical
      category: messaging
      condition_id: rabbit_disk
      alert_type: state
    annotations:
      summary: RabbitMQ磁盘低于水位
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 检查资源告警和发布阻塞，尽快恢复磁盘余量。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rabbitmq_disk_space_available_bytes{job="rabbitmq"} < rabbitmq_disk_space_available_limit_bytes{job="rabbitmq"}；持续
        2m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 2m
  - alert: RabbitMQQueueWithoutConsumers
    expr: (rabbitmq_queue_messages_ready{job="rabbitmq"} > 0) and on(instance,job,vhost,queue) (rabbitmq_queue_consumers{job="rabbitmq"}
      == 0)
    labels:
      severity: warning
      category: messaging
      condition_id: rabbit_consumer
      alert_type: state
    annotations:
      summary: 有待消费消息但无消费者
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 排除设计为延迟/死信的队列，检查消费者部署及失败。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: (rabbitmq_queue_messages_ready{job="rabbitmq"} > 0) and on(instance,job,vhost,queue) (rabbitmq_queue_consumers{job="rabbitmq"}
        == 0)；持续 15m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 15m
  - alert: RabbitMQQueueBacklog
    expr: rabbitmq_queue_messages_ready{job="rabbitmq"} > 10000
    labels:
      severity: warning
      category: messaging
      condition_id: rabbit_backlog
      alert_type: state
    annotations:
      summary: RabbitMQ待消费消息持续积压
      description: 目标={{ $labels.instance }}，当前计算值={{ $value }}。
      action: 按业务处理时限重定阈值，比较生产消费速率。
      runbook_url: https://github.com/yjj1030/prometheus-install/blob/main/catalog/RUNBOOKS.md#messaging
      resolved_summary: 告警条件已不再满足；请另行确认业务状态
      object: '{{ if $labels.service }}服务={{ $labels.service }} / {{ end }}目标={{ $labels.instance }}{{ if $labels.device
        }} / 设备={{ $labels.device }}{{ end }}{{ if $labels.ifIndex }} / 接口索引={{ $labels.ifIndex }}{{ end }}{{ if
        $labels.mountpoint }} / 挂载={{ $labels.mountpoint }}{{ end }}{{ if $labels.namespace }} / 命名空间={{ $labels.namespace
        }}{{ end }}{{ if $labels.pod }} / Pod={{ $labels.pod }}{{ end }}{{ if $labels.queue }} / 队列={{ $labels.queue
        }}{{ end }}{{ if $labels.volume }} / 卷={{ $labels.volume }}{{ end }}'
      current_value: '{{ $value }}（计算口径和单位见threshold表达式）'
      threshold: rabbitmq_queue_messages_ready{job="rabbitmq"} > 10000；持续 30m
      hostname: '{{ if $labels.hostname }}{{ $labels.hostname }}{{ else if $labels.nodename }}{{ $labels.nodename
        }}{{ else }}未提供{{ end }}'
    for: 30m
