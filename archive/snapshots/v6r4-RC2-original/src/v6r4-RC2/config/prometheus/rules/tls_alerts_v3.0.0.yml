#
# 指标语义对照（blackbox_exporter 0.25.0）：
#   - probe_ssl_earliest_cert_expiry    Unix timestamp；==0 表示探针未拿到证书
#   - probe_tls_version_info            TLS 版本数值（0x0303 = TLS 1.2）
#   - probe_failed_due_to_regex         早期版本存在；0.25 已弃用
#   - probe_http_status_code            HTTP 响应码（成功 2xx）
#
# 拆分为五种语义独立的告警：
#   1. SSLCertExpiringSoon*           证书过期倒计时（已有；blackbox_alerts 内）
#   2. SSLCertInvalid                 证书链无效 / 未拿到证书（已有）
#   3. SSLCertExpiredAlready          证书已过期（probe_ssl_earliest_cert_expiry < time()）
#   4. TLSVersionBelow12              版本过低（已有）
#   5. TLSHandshakeFailed             握手失败（probe_success=0 且非 HTTP 状态码）
#   6. TLSChainUntrusted              证书链不受信（单独探针配置）
