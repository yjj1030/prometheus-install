# ==============================================================================
# 常见踩坑
# ==============================================================================
#
#   - 表达式 (probe_ssl_earliest_cert_expiry - time()) 单位是秒
#     转换为天：除以 86400；转换为小时：除以 3600
#   - 不要使用 on(instance) group_left() 连接 probe_ssl_* 与 probe_http_*；
#     这两个指标的 instance label 内容不同（probe_ssl 用 SNI，probe_http 用 IP:port）
#   - TLS 1.3 (0x0304) 在 0.25.0 之前版本可能解析为 0x0303（旧库行为）
#   - 当 cert 为 ECDSA 时，probe_tls_version_info 与 RSA 不一致；不影响 alert 触发
#   - 跨午夜时区不影响证书过期时间（Unix timestamp 绝对值）
