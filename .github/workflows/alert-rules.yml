name: Alert rules
on:
  push:
    paths:
      - 'VERSION'
      - 'BASELINE.*'
      - 'DEPLOY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'catalog/**'
      - 'scenarios/**'
      - 'tests/alert-rules/**'
      - 'tests/alertmanager_integration.py'
      - 'tests/deploy_docs_test.py'
      - 'tools/*alert*'
      - '.github/workflows/alert-rules.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'BASELINE.*'
      - 'DEPLOY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'catalog/**'
      - 'scenarios/**'
      - 'tests/alert-rules/**'
      - 'tests/alertmanager_integration.py'
      - 'tests/deploy_docs_test.py'
      - 'tools/*alert*'
      - '.github/workflows/alert-rules.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Download and verify official validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation/bin
          cd .validation
          curl -fsSL --retry 3 https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz -o prometheus.tar.gz
          printf '%s  %s\n' e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a prometheus.tar.gz | sha256sum -c -
          tar --no-same-owner -xzf prometheus.tar.gz --strip-components=1 -C bin prometheus-3.5.0.linux-amd64/promtool
          curl -fsSL --retry 3 https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz -o alertmanager.tar.gz
          printf '%s  %s\n' 5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311 alertmanager.tar.gz | sha256sum -c -
          tar --no-same-owner -xzf alertmanager.tar.gz --strip-components=1 -C bin alertmanager-0.28.1.linux-amd64/amtool alertmanager-0.28.1.linux-amd64/alertmanager
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Validate generated profiles, rules, routes and inhibition
        run: bash tools/validate_alert_rules.sh
