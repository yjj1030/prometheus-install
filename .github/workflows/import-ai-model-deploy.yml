name: Import ai-model-deploy archive

on:
  push:
    paths:
      - 'archive/ai-model-deploy/MIGRATION_READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived repository tree
        shell: bash
        run: |
          set -euo pipefail
          base='archive/ai-model-deploy'
          test -f "$base/MIGRATION_READY"
          test -d "$base/MIGRATION_CHUNKS"
          cat "$base"/MIGRATION_CHUNKS/part-* | base64 -d > /tmp/ai-model-deploy.tar.xz
          expected=$(awk '{print $1}' "$base/MIGRATION_CHUNKS/ARCHIVE.sha256")
          actual=$(sha256sum /tmp/ai-model-deploy.tar.xz | awk '{print $1}')
          test "$expected" = "$actual"
          tar -xJf /tmp/ai-model-deploy.tar.xz -C "$base"
          rm -rf "$base/MIGRATION_CHUNKS" "$base/MIGRATION_READY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$base"
          git commit -m 'archive ai-model-deploy repository contents'
          git push
