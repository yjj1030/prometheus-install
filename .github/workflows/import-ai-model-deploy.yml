name: Import ai-model-deploy archive

on:
  push:
    paths:
      - 'archive/ai-model-deploy/MIGRATION_ARCHIVE_XZ.b64'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore archived repository tree
        shell: bash
        run: |
          set -euo pipefail
          base='archive/ai-model-deploy'
          test -s "$base/MIGRATION_ARCHIVE_XZ.b64"
          base64 -d "$base/MIGRATION_ARCHIVE_XZ.b64" > /tmp/ai-model-deploy.tar.xz
          mkdir -p "$base"
          tar -xJf /tmp/ai-model-deploy.tar.xz -C "$base"
          rm -f "$base/MIGRATION_ARCHIVE_XZ.b64"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$base"
          if git diff --cached --quiet; then
            echo 'No import changes detected.'
            exit 0
          fi
          git commit -m 'archive ai-model-deploy repository contents'
          git push
